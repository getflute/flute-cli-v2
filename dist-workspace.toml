# `.github/workflows/release.yml` is generated, never hand-written: run
# `dist init` to confirm these settings and `dist generate` to write it. A
# hand-edited release.yml fails `dist plan`'s own self-consistency check in CI.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
hosting = "github"

# The `update` command carries its own updater through `axoupdater`, so
# cargo-dist must not install a second one beside it.
install-updater = false

# **No `conflicts_with` on the Homebrew formula.** v1 and v2 are installed
# side by side on purpose: `devices` and `subscriptions` exist only in v1, so a
# formula that refused to coexist would take working commands away.
#
# No `tap` and no `publish-jobs`: without them cargo-dist attaches the formula
# to the release page rather than pushing it to a tap. Publishing to
# `getflute/homebrew-flute-cli-v2` needs a `HOMEBREW_TAP_TOKEN` secret on this
# repository, a fine-grained PAT with Contents: write on the tap, and a first
# commit on the tap for the publish job to check out.

# `keyring`'s linux-native backend links against libdbus-1, so the Ubuntu
# runner needs the headers or the build fails inside libdbus-sys.
[dist.dependencies.apt]
libdbus-1-dev = "*"
pkg-config = "*"

# Every action the generated workflow uses is pinned to a commit rather than a
# tag, so a moved tag cannot change what a release runs. The comment beside
# each hash names the release it was resolved from.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"          # v6.1.0
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f"   # v6.0.0
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
